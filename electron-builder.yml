appId: app.mine.note
productName: Mine
files:
  - dist/**/*
  - dist-electron/**/*
  - '!dist-electron/**/*.map'
  - package.json
# ESM imports cannot resolve packages that remain inside app.asar when the
# server/worker run from app.asar.unpacked (ERR_MODULE_NOT_FOUND).
asarUnpack:
  - dist-electron/**
  - node_modules/**
# Prebuilds cover Electron; skip host-platform rebuilds so CI/Docker can pack win/mac from Linux.
npmRebuild: false
directories:
  buildResources: build
  output: release
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
  identity: '-'
  hardenedRuntime: false
  artifactName: Mine-${version}-macos-arm64.${ext}
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Mine-${version}-windows-amd64.${ext}
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  packElevateHelper: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Mine
  uninstallDisplayName: Mine
